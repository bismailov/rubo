name: Rubo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Using a stable version, go.mod 1.25.7 seems like a future/typo version

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src/runtime/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('src/runtime/Cargo.lock') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libdl-dev

    - name: Run Go tests
      run: go test -v ./...

    - name: Run Rust tests
      run: cargo test --verbose --manifest-path src/runtime/Cargo.toml
